services:
  mongodb:
    image: mongo:7
    container_name: taskmanager-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: taskmanager
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: taskmanager-backend
    ports:
      - "5000:8080"
    env_file:
      - ./backend.env
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: taskmanager-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
